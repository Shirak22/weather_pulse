<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.x/dist/pixi.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Weather Pulse</title>
</head>

<body class="app-loading">

    <header class="header">
        <img class="smhi__logo" src="./assets/smhi-logo-120.png" alt="SMHI">
    </header>

    <main>
        <div id="status-overlay" class="status-overlay status-overlay--loading">
            <div class="status-overlay__card">
                <p class="status-overlay__title">Loading Weather Pulse</p>
                <p class="status-overlay__detail">Starting…</p>
                <div class="status-overlay__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="status-overlay__bar-fill"></div>
                </div>
                <p class="status-overlay__percent">0%</p>
            </div>
        </div>

        <section class="sidebar_right">
            <h1 class="title">Settings</h1>
            <ul class="sidebar__menu">
                <li id="dataInfo" class="sidebar__menu-child"></li>

                <li class="sidebar__menu-child">
                    <h2 class="sub_title">wind animation</h2>
                    <section class="sub_settings">
                        <label for="particle_tail">tail length <span id="particle_tail-length"></span></label>
                        <input type="range" id="particle_tail" min="10" max="100" step="10" value="10">
                    </section>
                    <section class="sub_settings">
                        <label for="particle_speed_factor">speed factor <span id="particle_tail-speed"></span></label>
                        <input type="range" id="particle_speed_factor" min="1" max="100" value="8">
                    </section>
                    <section class="sub_settings">
                        <label for="particle_colorize">colorize</label>
                        <input type="checkbox" id="particle_colorize">
                    </section>
                </li>

                <li class="sidebar__menu-child">
                    <h2 class="sub_title">Raster points</h2>
                    <section class="sub_settings">
                        <label for="geopoints_view">view points</label>
                        <input type="checkbox" id="geopoints_view">
                    </section>
                </li>

                <li class="sidebar__menu-child">
                    <h2 class="sub_title">Parameters</h2>
                    <section class="sub_settings">
                        <label for="parameters_wind">wind</label>
                        <input type="checkbox" id="parameters_wind" checked>
                    </section>
                    <section class="sub_settings">
                        <label for="parameters_temperature">temperature</label>
                        <input type="checkbox" id="parameters_temperature">
                    </section>
                </li>
            </ul>
            <footer class="sidebar__footer"><a href="https://opendata.smhi.se/metfcst/snow1gv1" target="_blank" rel="noopener">SMHI Open Data</a></footer>
        </section>

        <section id="sidebar__scale" class="sidebar__scale"></section>
        <section id="timeline"></section>
        <div id="map"></div>
    </main>

    <script type="module" src="js/main.js"></script>

</body>

</html>
