<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.x/dist/pixi.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Weather Pulse — Shirak Soghomonian</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("weather-pulse-theme");
                if (t !== "light" && t !== "dark") {
                    t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                }
                document.documentElement.setAttribute("data-theme", t);
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute("content", t === "light" ? "#d8e4f0" : "#0b1220");
            } catch (e) {}
        })();
    </script>
</head>

<body class="app-loading">

    <header class="app-header">
        <div class="brand">
            <p class="brand__name">Weather Pulse</p>
            <p class="brand__by">by Shirak Soghomonian</p>
        </div>
        <div class="app-header__actions">
            <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle light and dark theme" title="Theme">
                <span class="icon-btn__sun" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </span>
                <span class="icon-btn__moon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
                </span>
            </button>
            <button type="button" id="panel-toggle" class="icon-btn icon-btn--panel" aria-expanded="false" aria-controls="settings-panel" aria-label="Open settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
            </button>
        </div>
    </header>

    <main class="app-main">
        <div id="status-overlay" class="status-overlay status-overlay--loading">
            <div class="status-overlay__card">
                <p class="status-overlay__eyebrow">Weather Pulse</p>
                <p class="status-overlay__title">Loading</p>
                <p class="status-overlay__detail">Starting…</p>
                <div class="status-overlay__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="status-overlay__bar-fill"></div>
                </div>
                <p class="status-overlay__percent">0%</p>
            </div>
        </div>

        <div id="panel-backdrop" class="panel-backdrop" hidden></div>

        <aside id="settings-panel" class="settings-panel" aria-label="Settings">
            <div class="settings-panel__head">
                <h1 class="settings-panel__title">Settings</h1>
                <button type="button" id="panel-close" class="icon-btn" aria-label="Close settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>

            <ul class="settings-panel__menu">
                <li id="dataInfo" class="settings-block"></li>

                <li class="settings-block">
                    <h2 class="settings-block__title">Wind animation</h2>
                    <div class="setting-row">
                        <label for="particle_tail">Tail length <span id="particle_tail-length" class="setting-value"></span></label>
                        <input type="range" id="particle_tail" min="10" max="100" step="10" value="10">
                    </div>
                    <div class="setting-row">
                        <label for="particle_speed_factor">Speed <span id="particle_tail-speed" class="setting-value"></span></label>
                        <input type="range" id="particle_speed_factor" min="1" max="100" value="8">
                    </div>
                    <div class="setting-row setting-row--toggle">
                        <label for="particle_colorize">Colorize by speed</label>
                        <input type="checkbox" id="particle_colorize" class="toggle">
                    </div>
                </li>

                <li class="settings-block">
                    <h2 class="settings-block__title">Raster points</h2>
                    <div class="setting-row setting-row--toggle">
                        <label for="geopoints_view">Show grid points</label>
                        <input type="checkbox" id="geopoints_view" class="toggle">
                    </div>
                </li>

                <li class="settings-block">
                    <h2 class="settings-block__title">Layers</h2>
                    <div class="setting-row setting-row--toggle">
                        <label for="parameters_wind">Wind particles</label>
                        <input type="checkbox" id="parameters_wind" class="toggle" checked>
                    </div>
                    <div class="setting-row setting-row--toggle">
                        <label for="parameters_temperature">Temperature</label>
                        <input type="checkbox" id="parameters_temperature" class="toggle">
                    </div>
                </li>
            </ul>
        </aside>

        <section id="sidebar__scale" class="temp-scale" hidden></section>
        <section id="timeline" class="timeline" aria-label="Forecast timeline"></section>

        <p class="app-attribution">
            Data from
            <a href="https://opendata.smhi.se/metfcst/snow1gv1" target="_blank" rel="noopener noreferrer">SMHI Open Data API</a>
        </p>

        <div id="map"></div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
